[package]
name = "franck-condon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_benchmark"
path = "src/main.rs"

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
